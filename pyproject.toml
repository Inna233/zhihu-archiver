[project]
name = "zhihu-archiver"
version = "0.1.0"
description = "Archive a Zhihu user's public articles and pins to SQLite, JSONL, and Markdown."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "playwright>=1.48.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
zhihu-archiver = "zhihu_archiver.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zhihu_archiver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
